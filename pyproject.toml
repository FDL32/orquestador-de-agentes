[project]
name = "orquestacion-agentes"
version = "9.17.1"
description = "Multi-agent orchestration system with Manager/Builder architecture"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Orquestacion Agentes Contributors" }
]

[dependency-groups]
dev = [
    "ruff==0.15.1",
    "mypy==1.19.1",
    "pre-commit==4.5.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.0",
    "pip-audit==2.9.0",
    "requests==2.33.1",
    "pyyaml>=6.0",
    "pygments>=2.20.0",
    "rich>=15.0.0",
    "pyparsing>=3.0",
    "urllib3>=2.7.0",
    "tomli>=2.4.1",
    "vulture>=2.0",
    "deadcode>=2.0",
    "pytest-xdist>=3.6",
]

[tool.ruff]
src = ["src"]
target-version = "py310"
extend-exclude = [
    "tests/sandbox/",
    "scripts/sandbox/",
    ".codex/",
]
respect-gitignore = true
force-exclude = true
fix = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "B",      # flake8-bugbear
    "S",      # bandit (security)
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "I",      # isort
    "PERF",   # performance
    "UP",     # pyupgrade
    "C90",    # cyclomatic complexity (McCabe)
    "ERA",    # dead/commented code
    "SIM",    # simplifications
]
ignore = ["E501"]  # line too long handled by formatter

[tool.ruff.lint.isort]
no-sections = false
case-sensitive = true
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607", "S108", "SIM115"]
"tests/test_pre_commit_hooks.py" = ["PERF203"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --cov=src --cov-report=term-missing"
asyncio_mode = "auto"

[tool.pip-audit]
# Temporales: las versiones corregidas todavia no estan disponibles para el
# resolver desde PyPI. Retira cada excepcion cuando uv pueda bloquear la
# version indicada. Revalidado con `uv pip install "<pkg>==<fix>" --dry-run`
# antes de anadir o mantener cada entrada (no basta con el registro de CVE).
ignore-vuln = [
    "GHSA-6v7p-g79w-8964", # msgpack >=1.2.1 -- revalidado 2026-09-30, sigue sin resolver
    "GHSA-8988-9cw3-xx77", # urllib3 >=2.8.0 -- WOT-2026-086f, 2026-09-30, sin resolver
    "GHSA-vxq7-64xx-v4gw", # urllib3 >=2.8.0 -- WOT-2026-086f, 2026-09-30, sin resolver
    "GHSA-gh4c-6fx4-qh6g", # urllib3 >=2.8.0 -- WOT-2026-086f, 2026-09-30, sin resolver (3er GHSA, mismo paquete/fix)
    "PYSEC-2026-4011", # virtualenv >=21.7.12 (dev, via pre-commit) -- cierre WOT-2026-086f, 2026-09-30, sin resolver
    "PYSEC-2026-4012", # virtualenv >=21.7.11 (dev, via pre-commit) -- cierre WOT-2026-086f, 2026-09-30, sin resolver
    "PYSEC-2026-4013", # virtualenv >=21.7.13 (dev, via pre-commit) -- cierre WOT-2026-086f, 2026-09-30, sin resolver
    "PYSEC-2026-4014", # virtualenv >=21.7.12 (dev, via pre-commit) -- cierre WOT-2026-086f, 2026-09-30, sin resolver
    # CVE-2026-113726/113776/113732/113725 (virtualenv, alias CVE nuevo de la misma
    # deuda PYSEC de arriba) ya NO se ignoran: origin/main (112613c1, 2026-10-21) subio
    # virtualenv a 21.14.7 via ventana por-paquete en uv.toml, resolviendolas de verdad
    # (no solo ignorandolas). Retiradas al fusionar ese commit, 2026-10-22.
    # filelock >=4.0.0 (fix real en 4.2.1) -- deuda detectada en push del lote motor
    # v6 de WOT-2026-120a, 2026-10-24, sin resolver: TODA la rama 4.x exige
    # Python>=3.11 (verificado via metadata de PyPI y `uv pip install
    # "filelock==4.2.1" --dry-run` -> "current Python version (3.10.19) does not
    # satisfy Python>=3.11"), y este proyecto declara requires-python >=3.10.
    # No hay backport con fix conocido en la rama 3.x a esta fecha. Alcance de uso
    # confirmado (grep de virtualenv/util/lock.py): solo se usa la clase base
    # FileLock, nunca ReadWriteLock/AsyncReadWriteLock/SoftFileLock (las clases que
    # SI afectan estos 3 GHSA) -- no es alcanzable por la ruta transitiva real de
    # este repo (via virtualenv/python-discovery, grupo dev, sin import directo).
    # Explotacion exige ademas escritura local en el mismo directorio del lock
    # (symlink/fichero lateral plantado); riesgo residual bajo para tooling de
    # desarrollador en un solo equipo, no cero en todo entorno posible. Revisado
    # en bucle DESIGN_REVIEW de 3 lentes (qwen3.6, gemma4: ADOPTAR; codex:
    # ADOPTAR CON CAMBIOS), 2026-10-24. Retirar esta excepcion si el proyecto sube
    # su piso a Python>=3.11, si aparece un fix retroactivo en la rama 3.x, o si
    # virtualenv cambia su uso hacia alguna de las clases afectadas.
    "GHSA-v4x8-3wr5-3wq8", # filelock >=4.2.1 -- ReadWriteLock/AsyncReadWriteLock (Linux, symlink), inalcanzable, ver nota arriba
    "GHSA-9vhv-jxww-xfm5", # filelock >=4.2.1 -- ReadWriteLock/AsyncReadWriteLock (Windows, side files), inalcanzable, ver nota arriba
    "GHSA-567q-5qvw-pf92", # filelock >=4.2.1 -- SoftFileLock (Windows, oplock), inalcanzable, ver nota arriba
]

[tool.uv]
