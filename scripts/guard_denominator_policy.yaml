# Declaracion explicita: la clase no se infiere del codigo del guard; cada entrada la declara.
# no_denominator: el guard decide sobre UNA condicion, UN escalar o UN fichero FIJO del motor y no enumera un conjunto de elementos, de modo que no existe un denominador N que publicar ni un universo que pueda quedar vacio (si falta el fichero o el dato, falla cerrado o decide con un mensaje).
# fixed_denominator: el guard ancla su universo a un conjunto CERRADO del propio motor (resuelto desde __file__, MANIFEST.distribute o una lista literal versionada) y lo enumera; publica N, y N=0 solo puede significar que el arbol del motor esta roto, nunca un destino sin materia.
# staged_files: la clase la define QUIEN DECIDE EL UNIVERSO: lo entrega el propio hook de git en ese commit (indice staged o fichero de mensaje de commit), no lo que el guard descubre. NO se afirma que el vacio se publique siempre: lo que cada guard publica lo DECLARA skip_explicito.
# external_targets: el llamador aporta la raiz o el fichero (--project-root, posicional, --root, --config) y el universo es lo que exista en esa superficie externa, que puede faltar o estar vacia legitimamente; la policy declara si ese vacio publica marcador (skip_explicito: si) o falla cerrado (skip_explicito: no).
# Desempate modo dual: clasifica el modo que corre en el camino automatico (pre-commit/pre-push); el otro va en nota y no crea segunda entrada.
# Desempate fichero unico: pasado por el llamador = external_targets; fijo del motor = no_denominator.
# Las clases y skip_explicito se DECLARAN; este fichero no pretende inferirlos.

