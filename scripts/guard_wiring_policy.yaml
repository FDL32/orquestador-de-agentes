# POLITICA DE CABLEADO (WOT-2026-024u) -- datos, no codigo.
#
# Por que este fichero es YAML y no un dict dentro de check_guard_wiring.py:
# la deuda declarada dentro de un .py de la FRONTERA se auto-sabotea -- un paso
# de closeout que la imprima para reportarla cablearia a los declarados
# (auto-DoS, medido: 2/3). Los datos viven fuera del codigo que se audita.
#
# Tres bloques, cada uno con su format-check y su deteccion de stale:
#   known_unwired : guard -> ticket que lo cablea o BY-DESIGN. Deuda NOMBRADA.
#   extra_guards  : guards REALES cuyo nombre no lleva prefijo (check_/validate_/
#                   guard_). No se adivinan por heuristica: se declaran.
#   wired_via     : cableados que el AST no puede deducir (Makefile, shell,
#                   callable a >1 salto, glob-discovery). Cada entrada exige
#                   fichero:linea + probe reproducible; una entrada cuyo destino
#                   ya no existe es STALE y FALLA.

known_unwired:
  # Citados en prompts, ejecutados por nadie. El orquestador corrio estos A MANO
  # el 2026-07-14 como barreras obligatorias -- funcionaron porque alguien se acordo.
  # check_backlog_commits_landed: RETIRADO (WOT-2026-024q) -- ahora cableado via
  # import estatico: agent_controller.py::_ticket_landed_by_archived_commit hace
  # `from scripts.check_backlog_commits_landed import audit, parse_archived_commits`
  # y agent_controller --validate corre en pre-commit/closeout. El AST lo alcanza
  # ahora -> wired. Dejarlo aqui seria una declaracion STALE que el propio gate caza.
  validate_batch_dag: WOT-2026-023t
  # validate_observations: RETIRADO (WOT-2026-035b) -- ahora cableado via
  # check_portable_memory_archive_schema.py (pre-commit always_run + prepush),
  # que lo importa. Dejarlo aqui seria una declaracion STALE.
  check_portable_memory_promotion: WOT-2026-024r
  check_motor_pristine: WOT-2026-023y
  # check_destino_publish_ready (era WOT-2026-023b): quedo CABLEADO como efecto
  # colateral de WOT-2026-024w -- el nuevo run_motor_destination_integration_check en
  # prepush importa check_motor_destination_integration, que delega en
  # check_destino_publish_ready.main(). El AST lo alcanza ahora -> wired. Sale de
  # known_unwired (mantenerlo aqui seria una declaracion STALE que el propio gate caza).
  validate_contract_formation: WOT-2026-023m
  validate_agent_config: WOT-2026-019o
  # WOT-2026-024w DISPUSO los 9 huerfanos que el parser honesto de v2/v4 destapo:
  #   - 3 CABLEADOS a pre-commit always_run: check_ruff_hook_scope,
  #     check_skill_collisions, check_ticket_nomenclature (.pre-commit-config.yaml).
  #   - 2 CABLEADOS a prepush closeout-mode WARN/STRICT: check_closeout_reconciliation,
  #     check_motor_destination_integration (scripts/prepush_check.py).
  #   - 2 REPORTER renombrados sin prefijo check_ (precedente 022q): check_template_conformity
  #     -> template_conformity_report.py; validate_authority -> authority_report.py.
  #   - 1 RETIRADO: check_wp_087_deliverable (valida un artefacto inexistente; codigo muerto).
  # Ninguno queda como deuda -> 024w (DoD binario de la ficha satisfecho).
  # publication_gate NO se cablea a la fuerza: su dominio es una DECISION HUMANA.
  check_publication_gate: >-
    BY-DESIGN: gate de publicacion con checklist HUMANA (crear remoto privado,
    TOCTOU, verificacion final) -- su dominio es una decision humana de
    publicacion, no corre en un hook automatico. NO es deuda unwired. Follow-up
    (fuera de 024w): separar el nucleo automatico de la checklist humana.
  # Exencion DELIBERADA, no deuda: un hook automatico seria circular -- el propio
  # hook roto no puede invocar de forma fiable al check que detecta que esta roto.
  check_hook_interpreter: >-
    BY-DESIGN: stage manual deliberado; un hook automatico seria circular
    (el hook roto no puede invocar al check que detecta que esta roto)
  # bundle-guard determinista v0 (mejora-continua, arreglo rapido 2026-07-19). Valida
  # los bundles de gobierno (receipts). Su cableado natural es el flujo del colector
  # ANTES del fan-out, que toca los prompts de gobierno -> anti-recursion 026b prohibe
  # tocarlos en vuelo. Cableado + pasada Codex diferidos al ticket PDCA WOT-2026-038b
  # (componente 1). Deuda NOMBRADA con dueno real.
  check_bundle_receipts: WOT-2026-038b

extra_guards:
  # Barreras REALES sin prefijo de guard. v3 no podia ni verlas ni contarlas.
  pre_handoff_guard: scripts/pre_handoff_guard.py
  delivery_hygiene_check: scripts/delivery_hygiene_check.py

wired_via:
  # Cableado REAL de 2 saltos que el AST de 1 salto no alcanza (residual R5 de la spec):
  # guard_script = SCRIPT_DIR.parent/"scripts"/"pre_handoff_guard.py"  (salto 1: path->var)
  # cmd = [sys.executable, str(guard_script), ...]                     (salto 2: var->lista)
  # subprocess.run(cmd)                                                (sink)
  # Probe: python -c "import ast,pathlib; ...; assert 'pre_handoff_guard.py' in
  #   pathlib.Path('.agent/agent_controller.py').read_text()" -> el literal existe y el
  #   controller (frontera) lo ejecuta via _run_pre_handoff_guard.
  pre_handoff_guard: >-
    .agent/agent_controller.py:2926 (guard_script = SCRIPT_DIR.parent/"scripts"/
    "pre_handoff_guard.py") -> cmd=[...] :2931 -> subprocess.run(cmd) en
    _run_pre_handoff_guard, llamado desde :3357. Probe: grep pre_handoff_guard.py
    .agent/agent_controller.py (2 saltos, fuera del alcance de 1-hop del AST)
