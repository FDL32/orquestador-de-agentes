# POLITICA DE CABLEADO (WOT-2026-024u) -- datos, no codigo.
#
# Por que este fichero es YAML y no un dict dentro de check_guard_wiring.py:
# la deuda declarada dentro de un .py de la FRONTERA se auto-sabotea -- un paso
# de closeout que la imprima para reportarla cablearia a los declarados
# (auto-DoS, medido: 2/3). Los datos viven fuera del codigo que se audita.
#
# Tres bloques, cada uno con su format-check y su deteccion de stale:
#   known_unwired : guard -> ticket que lo cablea o BY-DESIGN. Deuda NOMBRADA.
#   extra_guards  : guards REALES cuyo nombre no lleva prefijo (check_/validate_/
#                   guard_). No se adivinan por heuristica: se declaran.
#   wired_via     : cableados que el AST no puede deducir (Makefile, shell,
#                   callable a >1 salto, glob-discovery). Cada entrada exige
#                   fichero:linea + probe reproducible; una entrada cuyo destino
#                   ya no existe es STALE y FALLA.

known_unwired:
  # Citados en prompts, ejecutados por nadie. El orquestador corrio estos A MANO
  # el 2026-07-14 como barreras obligatorias -- funcionaron porque alguien se acordo.
  # check_backlog_commits_landed: RETIRADO (WOT-2026-024q) -- ahora cableado via
  # import estatico: agent_controller.py::_ticket_landed_by_archived_commit hace
  # `from scripts.check_backlog_commits_landed import audit, parse_archived_commits`
  # y agent_controller --validate corre en pre-commit/closeout. El AST lo alcanza
  # ahora -> wired. Dejarlo aqui seria una declaracion STALE que el propio gate caza.
  # validate_batch_dag: RETIRADO (WOT-2026-027h) -- ahora cableado via import
  # estatico: scripts/check_flight_plan_collision.py hace
  # `from validate_batch_dag import _normalize_surface` (reuso de la forma
  # canonica de ruta, mandado por la ficha) y ese check hermano SI corre solo en
  # prepush_check.py::run_flight_plan_collision_check (closeout). El AST lo alcanza
  # ahora -> wired. Dejarlo aqui seria una declaracion STALE que el propio gate
  # caza (mismo patron que check_backlog_commits_landed / validate_observations).
  # validate_observations: RETIRADO (WOT-2026-035b) -- ahora cableado via
  # check_portable_memory_archive_schema.py (pre-commit always_run + prepush),
  # que lo importa. Dejarlo aqui seria una declaracion STALE.
  check_portable_memory_promotion: WOT-2026-024r
  # check_motor_pristine: RETIRADO de known_unwired (cierre 2026-07-22) -- SI esta
  # cableado, pero a 2 saltos que el AST de 1-hop no alcanza (string en lista de
  # subprocess dentro del recolector). Movido a wired_via con probe. Su dueno
  # original WOT-2026-023y esta archivado, coherente: el trabajo se hizo.
  # check_destino_publish_ready (era WOT-2026-023b): quedo CABLEADO como efecto
  # colateral de WOT-2026-024w -- el nuevo run_motor_destination_integration_check en
  # prepush importa check_motor_destination_integration, que delega en
  # check_destino_publish_ready.main(). El AST lo alcanza ahora -> wired. Sale de
  # known_unwired (mantenerlo aqui seria una declaracion STALE que el propio gate caza).
  # validate_contract_formation: RETIRADO (WOT-2026-023m(c)) -- ahora cableado via
  # import estatico en prepush_check.py::run_contract_formation_check (closeout,
  # bloqueante) sobre el CF triple del motor. El AST lo alcanza ahora -> wired.
  # Dejarlo aqui seria una declaracion STALE que el propio gate caza.
  validate_agent_config: WOT-2026-019o
  # WOT-2026-024w DISPUSO los 9 huerfanos que el parser honesto de v2/v4 destapo:
  #   - 3 CABLEADOS a pre-commit always_run: check_ruff_hook_scope,
  #     check_skill_collisions, check_ticket_nomenclature (.pre-commit-config.yaml).
  #   - 2 CABLEADOS a prepush closeout-mode WARN/STRICT: check_closeout_reconciliation,
  #     check_motor_destination_integration (scripts/prepush_check.py).
  #   - 2 REPORTER renombrados sin prefijo check_ (precedente 022q): check_template_conformity
  #     -> template_conformity_report.py; validate_authority -> authority_report.py.
  #   - 1 RETIRADO: check_wp_087_deliverable (valida un artefacto inexistente; codigo muerto).
  # Ninguno queda como deuda -> 024w (DoD binario de la ficha satisfecho).
  # publication_gate NO se cablea a la fuerza: su dominio es una DECISION HUMANA.
  check_publication_gate: >-
    BY-DESIGN: gate de publicacion con checklist HUMANA (crear remoto privado,
    TOCTOU, verificacion final) -- su dominio es una decision humana de
    publicacion, no corre en un hook automatico. NO es deuda unwired. Follow-up
    (fuera de 024w): separar el nucleo automatico de la checklist humana.
  # Exencion DELIBERADA, no deuda: un hook automatico seria circular -- el propio
  # hook roto no puede invocar de forma fiable al check que detecta que esta roto.
  check_hook_interpreter: >-
    BY-DESIGN: stage manual deliberado; un hook automatico seria circular
    (el hook roto no puede invocar al check que detecta que esta roto)
  # bundle-guard determinista v0 (mejora-continua, arreglo rapido 2026-07-19). Valida
  # los bundles de gobierno (receipts). Su cableado natural es el flujo del colector
  # ANTES del fan-out, que toca los prompts de gobierno -> anti-recursion 026b prohibe
  # tocarlos en vuelo. Cableado + pasada Codex diferidos al ticket PDCA WOT-2026-038b
  # (componente 1). Deuda NOMBRADA con dueno real.
  # ESTADO REAL ACTUALIZADO 2026-07-27 (WOT-2026-042k, hijo de 038b): YA HAY
  # INVOCADOR, en modo CANARY -- `ensemble_dispatch.run_pipeline` llama a
  # `receipt_canary()` sobre el payload REAL justo antes del ROUND 0, que es el
  # punto donde el bundle alcanza a las lentes (HUECO-1). NO se tocaron los
  # prompts de gobierno: el canary audita el payload EN VUELO, asi que la
  # anti-recursion 026b no era el bloqueo que esta nota daba por supuesto.
  # SIGUE LISTADO AQUI Y ES CORRECTO: `ensemble_dispatch` no es FRONTERA para
  # este guard (no corre solo; lo lanza un agente al abrir un fan-out) y el
  # canary OBSERVA sin bloquear -- deliberado: 35 pass / 19 fail sobre los 54
  # bundles con `## PROBE` medidos 2026-07-27 (`--root <motor>`), o sea que
  # fail-closed nace en rojo y reproduce el deadlock de WOT-2026-042h.
  # PARA DEJAR DE SER DEUDA: promover el canary a bloqueante cuando sus propias
  # mediciones muestren saneado el rojo historico. Dueno: WOT-2026-038b.
  check_bundle_receipts: WOT-2026-038b
  # check_prompt_bias (WOT-2026-026k): gate MECANICO de sesgo del PROMPT de review.
  # Su cableado natural es el arranque del bucle de review (ensemble dispatch /
  # review bridge), que vive en `bus/` -- FORBIDDEN SURFACE del contrato frozen
  # T-026K-001 (FLT acotada a los 3 scripts + 2 tests; bus/ prohibido). El
  # MECANISMO se entrega aqui; su invocacion desde el loop es follow-up declarado.
  # RE-DECLARADO 2026-07-22 (su dueno original WOT-2026-026k quedo archivado con
  # el guard aun unwired -- huerfano cazado por el orphan-owner check): el dueno
  # VIVO es WOT-2026-038b, que ya posee el cableado del bundle-guard hermano
  # (check_bundle_receipts) en el mismo arranque del bucle. Nota de estado real:
  # build_extraction_prompt.py (WOT-2026-027q, commit 76b761b) ya lo importa y lo
  # ejecuta en sus gates, pero ese generador aun no tiene invocador de frontera
  # propio -- cablear ambos es el mismo trabajo de 038b.
  check_prompt_bias: WOT-2026-038b

  # WOT-2026-034c: el detector nace STANDALONE por diseno del propio ticket --
  # cablearlo en prepush es NON-GOAL declarado y se pedira como follow-up propio.
  # La deuda se declara aqui, con dueno, para que no entre como huerfano silencioso.
  check_dod_metric_freshness: WOT-2026-034c

extra_guards:
  # Barreras REALES sin prefijo de guard. v3 no podia ni verlas ni contarlas.
  pre_handoff_guard: scripts/pre_handoff_guard.py
  delivery_hygiene_check: scripts/delivery_hygiene_check.py
  # WOT-2026-049c: `prepush_check` no lleva prefijo check_/validate_/guard_, asi
  # que NUNCA entraba en el denominador de find_guards() -- el exit 0 del guard
  # no lo aprobaba, es que no lo veia. Declararlo aqui lo mete en el censo; el
  # veredicto (cableado vs norma declarada) lo decide `wired_via` mas abajo.
  prepush_check: scripts/prepush_check.py

wired_via:
  # check_loop_bundle_protocol (2026-08-05): import LAZY dentro del handler de
  # `loop-round`, no en el modulo -- por eso el AST de 1-hop no lo alcanza. Es un
  # camino que corre solo: TODA ronda de bucle pasa por ahi antes de despachar.
  # Avisa (WARN, no bloquea) si el bundle no declara sus 3 invariantes de
  # suficiencia. Medido con la misma lente: 106 bytes sin protocolo vs 4708 con el.
  check_loop_bundle_protocol: >-
    scripts/ensemble_dispatch.py:2164 (from scripts.check_loop_bundle_protocol
    import check_bundle, dentro de cmd_loop_round) -> check_bundle(...) :2166.
    Probe: python scripts/ensemble_dispatch.py loop-round --content-file
    <bundle-sin-protocolo> ... -> imprime "[loop-bundle] WARN: el bundle no
    declara 3 invariante(s)"; con un bundle conforme, 0 avisos.
  # Cableado REAL de 2 saltos que el AST de 1 salto no alcanza (residual R5 de la spec):
  # guard_script = SCRIPT_DIR.parent/"scripts"/"pre_handoff_guard.py"  (salto 1: path->var)
  # cmd = [sys.executable, str(guard_script), ...]                     (salto 2: var->lista)
  # subprocess.run(cmd)                                                (sink)
  # Probe: python -c "import ast,pathlib; ...; assert 'pre_handoff_guard.py' in
  #   pathlib.Path('.agent/agent_controller.py').read_text()" -> el literal existe y el
  #   controller (frontera) lo ejecuta via _run_pre_handoff_guard.
  pre_handoff_guard: >-
    .agent/agent_controller.py:2926 (guard_script = SCRIPT_DIR.parent/"scripts"/
    "pre_handoff_guard.py") -> cmd=[...] :2931 -> subprocess.run(cmd) en
    _run_pre_handoff_guard, llamado desde :3357. Probe: grep pre_handoff_guard.py
    .agent/agent_controller.py (2 saltos, fuera del alcance de 1-hop del AST)
  # check_motor_pristine (movido desde known_unwired, cierre 2026-07-22): el
  # recolector de salud lo EJECUTA como subprocess en cada auditoria de cierre
  # (camino que corre solo). String-en-lista = 2 saltos, el AST de 1-hop no lo ve.
  check_motor_pristine: >-
    scripts/collect_system_health.py:449-460 (checks["motor_pristine_snapshot"] =
    _run([sys.executable, "scripts/check_motor_pristine.py", "--snapshot", ...])).
    Probe: grep -n "check_motor_pristine.py" scripts/collect_system_health.py
    -> :452; el recolector corre en cada system-health audit del cierre.
