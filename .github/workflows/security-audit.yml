name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Run pre-commit hooks (pre-push stage)
      run: uv run pre-commit run --all-files --hook-stage pre-push

    - name: Run Gitleaks (OSS CLI)
      # WOT-2026-010x: replace gitleaks/gitleaks-action@v2 (license-gated) with the
      # OSS gitleaks CLI. No GITLEAKS_LICENSE, no GITHUB_TOKEN for this step, no JS
      # action runtime. Reuses the existing portable seed config; fail-closed:
      # `gitleaks detect --exit-code 1` exits non-zero (and the step fails) on a leak.
      env:
        GITLEAKS_VERSION: "8.30.1"
      run: |
        set -euo pipefail
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sSfL "$url" -o gitleaks.tar.gz
        tar -xzf gitleaks.tar.gz gitleaks
        ./gitleaks version
        ./gitleaks detect --source . --config agent_system/templates/gitleaks.config.toml --redact --exit-code 1 --log-opts="--all"
