    surface: python_self_running
    should_wire: false
    should_wire_override: false
    negative_reason: prose_in_sink_arg
    why: >
      RESIDUAL FALSO-UNWIRED declarado (fail-closed, teorico). `["python","-m",
      "scripts.check_x"]` con -m como ELEMENTO SEPARADO de la lista: cada string se
      procesa por _sink_arg_tokens por separado, y "scripts.check_x" no acaba en .py,
      asi que v4 no lo ve -> unwired. La forma en UNA sola string ("python -m
      scripts.check_x") SI funciona. Es falso-UNWIRED (ruidoso, seguro), no falso-WIRED:
      ningun guard real se cablea asi (grep vacio). Resolverlo exigiria analisis
      cross-token en listas argv -- complejidad que no compensa para un caso ausente.
      Si algun dia ocurriera, se declara en wired_via. should_wire false porque v4
      HOY lo da unwired y ese es su comportamiento documentado, no un objetivo a romper.
    regression_origin: "v4 (2026-07-15): limite fail-closed de la rama -m; prueba de estres del fix"
    files:
      scripts/prepush_check.py: |
