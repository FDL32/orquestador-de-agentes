cache-dir = '.agent/runtime/uv-cache'
exclude-newer = '2026-05-16'
# WOT-2026-058n: `exclude-newer` global (arriba) congela el indice al 2026-05-16, asi que
# uv NO ve pip 26.1.2/26.2/26.2.1 (publicadas 05-31, 07-29 y 08-04) y respondia
# "only pip<=26.1.1 is available" mientras PyPI si las servia. Eso dejaba PYSEC-2026-3721
# sin fix posible y BLOQUEABA todo push (hook pip-audit, exit 1).
# Corte POR-PAQUETE en vez de mover el global: sube solo pip (1 version) en lugar de
# arrastrar 15 paquetes, que exigiria re-correr la suite sobre un entorno distinto.
# certifi 2026.10.19 corrige GHSA-6q48-6c7w-9gw2; el cutoff global lo oculta,
# asi que se abre una ventana por-paquete solo para certifi (mismo patron).
# virtualenv 21.14.2/21.14.4/21.14.7 corrigen CVE-2026-113776/113732/113726/113725
# (publicadas 2026-10-01 a 2026-10-12); el cutoff global las oculta igual que a pip
# y certifi -- mismo patron, ventana por-paquete en vez de ignore-vuln (esas 4 CVEs
# SI tienen fix real, a diferencia de PYSEC-2026-4011..4014 que siguen sin resolver).
# distlib: virtualenv 21.14.7 exige distlib>=0.4.3,<1 (publicada 2026-06-12), que el
# cutoff global tambien ocultaba -- sin esta ventana el resolver de virtualenv falla
# con "Because only distlib<=0.4.0 is available". Misma ventana que virtualenv.
# packaging: virtualenv 21.14.7 exige packaging>=26.3 (publicada 2026-08-04), tercera
# dependencia en cadena bloqueada por el mismo cutoff. Confirmado via OSV
# (api.osv.dev) que CVE-2026-113725 (la 4a de las 4 CVEs de virtualenv) SOLO se
# corrige en 21.14.7 exacta -- no hay version intermedia que cubra las 4 sin esta
# cadena completa (distlib + packaging + python-discovery).
# python-discovery: virtualenv 21.14.7 exige python-discovery>=1.6.1 (publicada
# 2026-09-18), cuarta dependencia en cadena bloqueada por el mismo cutoff.
# typing-extensions: virtualenv 21.14.7 exige typing-extensions>=4.16 (publicada
# 2026-07-02) en python<3.11, quinta dependencia en cadena.
# virtualenv 21.14.9 corrige GHSA-c978-59m8-c77v, publicada fuera de la ventana
# 2026-10-13 que 21.14.7 ya necesitaba -- WOT-2026-086f resurgio con un GHSA nuevo
# apenas se subio a 21.14.7 (mismo patron de alias/CVE-nuevo-sobre-fix-reciente que
# las 4 CVEs de arriba); revalidado 2026-10-22 con `uv pip install "virtualenv==
# 21.14.9" --dry-run` bajo esta ventana extendida, 7 paquetes resueltos sin tocar
# distlib/packaging/python-discovery/typing-extensions (sus propias ventanas siguen
# sirviendo a 21.14.9 sin cambios).
exclude-newer-package = { pip = '2026-08-21', certifi = '2026-10-20', virtualenv = '2026-10-22', distlib = '2026-10-13', packaging = '2026-10-13', python-discovery = '2026-10-13', typing-extensions = '2026-10-13', msgpack = '2026-10-29' }
# msgpack: 1.2.4 (<=2026-10-29) corrige GHSA-6v7p-g79w-8964 (fix real 1.2.1, deuda
# vieja "sigue sin resolver" desde 2026-09-30) Y GHSA-j586-36cw-2gc2 (fix 1.2.3,
# detectado en cierre vuelo-20261026b, 2026-10-29) sin tocar el piso de Python
# (ambas versiones exigen >=3.10, igual que el proyecto). Revalidado via PyPI JSON
# (upload_time + requires_python) 2026-10-29.
#
# filelock NO lleva ventana aqui (mismo motivo que la version anterior de esta
# nota, pero con el mecanismo correcto -- 2 correcciones en la misma sesion,
# 2026-10-29, via bucle adversarial CHA-2):
#
# 1a vuelta: se reporto que subir filelock via ventana dejaba CIEGO el gate de
# push (`scripts/pip_audit_project.py`) por un supuesto bug de deduplicacion
# de `resolution-markers`. Repro de esa vuelta: FALSO -- se hizo con un
# `python` suelto del PATH (sistema, 3.12.10), no con el interprete del
# proyecto; bajo 3.10.19 real (`uv run --frozen python ...`) el gate SI ve
# filelock==4.1.0 (`Found 9 known vulnerabilities`, exit 1). Refutado por
# codex Sol gamsgo (CHA-2) y reproducido de forma independiente por OR-7.
#
# 2a vuelta (alvarovans/Claude Opus, mismo bucle CHA-2, tras la correccion de
# arriba): el blind spot SI es real, por una causa DISTINTA, YA ACTIVA hoy,
# sin relacion con esta ventana. El hook `pip-audit` en `.pre-commit-config.yaml`
# es `language: python` SIN `default_language_version` -- pre-commit crea su
# propio venv aislado para el hook con el Python que estaba activo cuando se
# creo ese venv (confirmado en disco, 2026-10-29: de 5 repos `language: python`
# cacheados en este checkout, 3 usan Python 3.12.10 y 2 usan 3.10.19 -- lo
# decide el entorno de quien ejecuto `pre-commit install`/`run` primero, no
# `requires-python` del proyecto). Bajo 3.12, pip-audit evalua los markers
# `python_version` del export y SOLO audita la rama `>=3.11` -- cualquier
# paquete con marker queda invisible, YA incluye `backports-asyncio-runner` y
# `exceptiongroup` en el lock actual, sin que haya que tocar filelock para
# disparalo. No adoptar la ventana de filelock mientras este blind spot este
# activo: su fix no toca `uv.toml` sino `.pre-commit-config.yaml`
# (`default_language_version: {python: python3.10}`, o apuntar el `entry` al
# `.venv` del proyecto en vez de a `python` suelto). Prioridad alta para
# triaje de backlog (sin WOT-id aun) -- afecta a TODO paquete marker-gated del
# lock, no solo a filelock, y ya esta activo en produccion hoy.
