repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Verificaciones no mutadoras (disponibles en pre-commit y pre-push)
      - id: check-yaml
        exclude: ^tests/sandbox/
      - id: check-json
        exclude: ^tests/sandbox/
      - id: check-toml
        exclude: ^tests/sandbox/
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-ast
        exclude: ^tests/sandbox/
      # Hooks mutadores: SOLO pre-commit, excluyen artefactos generados
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '^(\.agent/runtime/|\.agent/collaboration/|tests/sandbox/|.*\.svg$|\.agent/context/project_map\.md$|\.agent/context/project-map\.json$|\.agent/context/|\.agent/runtime/events/)'
      - id: mixed-line-ending
        stages: [pre-commit]
        args: [--fix=lf]
        exclude: '^(\.agent/runtime/|\.agent/collaboration/|tests/sandbox/|.*\.ps1$|.*\.cmd$|.*\.bat$|\.agent/context/project_map\.md$|\.claude/settings\.json$|\.agent/context/|\.agent/runtime/events/)'
      - id: trailing-whitespace
        stages: [pre-commit]
        args: [--markdown-linebreak-ext=md]
        exclude: '^(\.agent/runtime/|\.agent/collaboration/|tests/sandbox/|\.agent/context/|\.agent/runtime/events/)'

  - repo: local
    hooks:
      # Hook scope protected by scripts/check_ruff_hook_scope.py to prevent non-Python/Markdown drift
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: true
        types: [python]

      # ruff-format es mutador: SOLO pre-commit
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: true
        stages: [pre-commit]
        types: [python]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.3
    hooks:
      - id: uv-lock
        stages: [pre-commit]

  - repo: local
    hooks:
      # Never commit from the motor's DETACHED consumption checkout: the commit
      # would land on no branch and be one sync_principal.py away from being lost.
      # A session did exactly this on 2026-07-14 and its 2 commits had to be
      # rescued. check_worktree_topology.py already detected the shape and is
      # fail-closed -- but it needs a --ticket and nothing ran it. This hook needs
      # neither, and fires at the last moment the mistake is still cheap.
      # always_run: sin el, un commit de SOLO BORRADOS no pasa ficheros al hook y
      # pre-commit se lo salta entero -- justo el commit que mas conviene vigilar.
      - id: check-commit-worktree
        name: check commit worktree (no commits in the detached motor checkout)
        entry: uv run python scripts/check_commit_worktree.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Guard-of-guards: a guard nobody invokes is a norm, not a barrier. Measured on
      # 2026-07-14: 15 of 25 guards ran on their own -- among the nine "cited in a prompt
      # but executed by nobody" were three the orchestrator had used BY HAND that same day
      # as mandatory barriers. Existing debt WARNS (it is declared, with its ticket);
      # a NEW unwired guard FAILS. That asymmetry is what stops the debt from growing.
      - id: check-guard-wiring
        name: check guard wiring (a guard nobody invokes is a norm, not a barrier)
        entry: uv run python scripts/check_guard_wiring.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Guard: lo que VIAJA no puede nombrar ESTA maquina. El denominador sale de
      # MANIFEST.distribute (52 entradas -> 143 ficheros tracked; skills/ expande a
      # 92). Caza el nombre del workspace, el sufijo _dev de la worktree, la raiz de
      # perfiles y el username en runtime. La norma ya vivia en el prompt de cierre
      # (seccion 3.5); esto es el MECANISMO. always_run + pass_filenames:false porque
      # el denominador viene del MANIFEST, no del argv.
      - id: check-distribution-agnostic
        name: check distribution agnostic (lo que viaja no nombra esta maquina)
        entry: uv run python scripts/check_distribution_agnostic.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Guard against dangerous truncation of execution_log.md without archive compensation
      - id: check-history-truncation
        name: check history truncation guard
        entry: uv run python scripts/check_no_history_truncation.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: check-encoding-guard
        name: check encoding guard
        entry: uv run python scripts/check_encoding_guard.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # WOT-2026-003c: tracked .claude/settings.json must stay portable (no
      # personal permissions.allow) and any write-gating hook must FAIL CLOSED
      # (never exit 0 when its guard cannot be resolved). Prevents the A2d-class
      # regression where a removed guard left the hook silently allowing writes.
      - id: check-claude-settings-portability
        name: check claude settings portability
        entry: uv run python scripts/check_claude_settings_portability.py .claude/settings.json
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # pip-audit: auditoria CVE desde uv.lock (todos los grupos).
      # El wrapper exporta uv.lock a requirements.txt temporal y llama pip-audit -r.
      # Garantia: audita la superficie real del proyecto, no el Python del sistema.
      - id: pip-audit
        name: pip-audit (CVE Detection)
        entry: python scripts/pip_audit_project.py
        language: python
        additional_dependencies: [pip-audit]
        pass_filenames: false
        stages: [pre-push, manual]

      # check-hook-interpreter: detecta INSTALL_PYTHON obsoleto en los hooks
      # generados (repo movido, WOT-2026-016b). Stage manual: un hook automatico
      # seria circular (el propio hook roto no puede invocar de forma fiable al
      # check). Ejecutable por tooling de instalacion o bajo demanda.
      - id: check-hook-interpreter
        name: check hook interpreter (INSTALL_PYTHON stale path)
        entry: uv run python scripts/check_hook_interpreter.py
        language: system
        pass_filenames: false
        stages: [manual]

      # vulture: verificacion no mutadora, solo manual
      - id: vulture
        name: vulture - dead code detection
        entry: uv run vulture bus/ runtime/ scripts/ skills/ tools/ --min-confidence 80 --exclude whitelists,.agent,.cache,.claude,.codex,.opencode,.tmp,.uv-cache,.ruff_cache,tests
        language: system
        types: [python]
        stages: [manual]
