repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Verificaciones no mutadoras (disponibles en pre-commit y pre-push)
      - id: check-yaml
        exclude: ^tests/sandbox/
      - id: check-json
        exclude: ^tests/sandbox/
      - id: check-toml
        exclude: ^tests/sandbox/
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-ast
        exclude: ^tests/sandbox/
      # Hooks mutadores: SOLO pre-commit, excluyen artefactos generados
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '^(\.agent/runtime/|\.agent/collaboration/|tests/sandbox/|.*\.svg$|\.agent/context/project_map\.md$|\.agent/context/project-map\.json$|\.agent/context/|\.agent/runtime/events/)'
      - id: mixed-line-ending
        stages: [pre-commit]
        args: [--fix=lf]
        exclude: '^(\.agent/runtime/|\.agent/collaboration/|tests/sandbox/|.*\.ps1$|.*\.cmd$|.*\.bat$|\.agent/context/project_map\.md$|\.claude/settings\.json$|\.agent/context/|\.agent/runtime/events/)'
      - id: trailing-whitespace
        stages: [pre-commit]
        args: [--markdown-linebreak-ext=md]
        exclude: '^(\.agent/runtime/|\.agent/collaboration/|tests/sandbox/|\.agent/context/|\.agent/runtime/events/)'

  - repo: local
    hooks:
      # Hook scope enforced by the check-ruff-hook-scope hook below (WOT-2026-024w:
      # cableado real, ya no un comentario sin ejecutar).
      # --no-fix es OBLIGATORIO: pyproject.toml declara `fix = true`, asi que
      # `ruff check` REESCRIBE ficheros por configuracion aunque no se pase
      # `--fix`. Medido 2026-08-05: `ruff check <f> --select RUF100` retiro 2
      # `# noqa: S603` de un fichero del arbol sin que nadie pidiera un fix.
      # Un hook de verificacion que MUTA no es una verificacion.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --no-fix
        language: system
        pass_filenames: true
        types: [python]

      # ruff-format es mutador: SOLO pre-commit
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: true
        stages: [pre-commit]
        types: [python]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.3
    hooks:
      - id: uv-lock
        stages: [pre-commit]

  - repo: local
    hooks:
      # Never commit from the motor's DETACHED consumption checkout: the commit
      # would land on no branch and be one sync_principal.py away from being lost.
      # A session did exactly this on 2026-07-14 and its 2 commits had to be
      # rescued. check_worktree_topology.py already detected the shape and is
      # fail-closed -- but it needs a --ticket and nothing ran it. This hook needs
      # neither, and fires at the last moment the mistake is still cheap.
      # always_run: sin el, un commit de SOLO BORRADOS no pasa ficheros al hook y
      # pre-commit se lo salta entero -- justo el commit que mas conviene vigilar.
      - id: check-commit-worktree
        name: check commit worktree (no commits in the detached motor checkout)
        entry: uv run python scripts/check_commit_worktree.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Guard-of-guards: a guard nobody invokes is a norm, not a barrier. Measured on
      # 2026-07-14: 15 of 25 guards ran on their own -- among the nine "cited in a prompt
      # but executed by nobody" were three the orchestrator had used BY HAND that same day
      # as mandatory barriers. Existing debt WARNS (it is declared, with its ticket);
      # a NEW unwired guard FAILS. That asymmetry is what stops the debt from growing.
      - id: check-guard-wiring
        name: check guard wiring (a guard nobody invokes is a norm, not a barrier)
        entry: uv run python scripts/check_guard_wiring.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # WOT-2026-024w: tres guards que el parser honesto de check_guard_wiring
      # (024u) destapo como HUERFANOS -- barreras reales que nadie invocaba. Se
      # cablean aqui como hooks always_run: escanean el arbol vivo (no ficheros
      # concretos), corren sin args (--root defaults al motor) y son fail-closed.
      - id: check-ruff-hook-scope
        name: check ruff hook scope (ruff hooks stay Python-only)
        entry: uv run python scripts/check_ruff_hook_scope.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-skill-collisions
        name: check skill collisions (no duplicate skill name/trigger)
        entry: uv run python scripts/check_skill_collisions.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-ticket-nomenclature
        name: check ticket nomenclature (no live generator uses a legacy prefix)
        entry: uv run python scripts/check_ticket_nomenclature.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-stale-operational-note
        name: check stale operational note (prohibir una via por fallo exige fecha)
        entry: uv run python scripts/check_stale_operational_note.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-suite-freshness
        name: check suite freshness (avisa si este commit invalida la suite verde)
        entry: uv run python scripts/check_suite_freshness.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Guard: lo que VIAJA no puede nombrar ESTA maquina. El denominador sale de
      # MANIFEST.distribute (52 entradas -> 143 ficheros tracked; skills/ expande a
      # 92). Caza el nombre del workspace, el sufijo _dev de la worktree, la raiz de
      # perfiles y el username en runtime. La norma ya vivia en el prompt de cierre
      # (seccion 3.5); esto es el MECANISMO. always_run + pass_filenames:false porque
      # el denominador viene del MANIFEST, no del argv.
      - id: check-distribution-agnostic
        name: check distribution agnostic (lo que viaja no nombra esta maquina)
        entry: uv run python scripts/check_distribution_agnostic.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Guard: enforce MANIFEST.distribute frontier as a MECHANISM (WOT-2026-025i).
      # Every manifest entry must resolve to >=1 tracked file (no stale entries =
      # no holes in the frontier). Always_run + pass_filenames:false because the
      # denominator comes from the MANIFEST, not from argv.
      - id: check-distribution-boundary
        name: check distribution boundary (every manifest entry resolves to tracked files)
        entry: uv run python scripts/check_distribution_boundary.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Guard against dangerous truncation of execution_log.md without archive compensation
      - id: check-history-truncation
        name: check history truncation guard
        entry: uv run python scripts/check_no_history_truncation.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: check-encoding-guard
        name: check encoding guard
        entry: uv run python scripts/check_encoding_guard.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # WOT-2026-003c: tracked .claude/settings.json must stay portable (no
      # personal permissions.allow) and any write-gating hook must FAIL CLOSED
      # (never exit 0 when its guard cannot be resolved). Prevents the A2d-class
      # regression where a removed guard left the hook silently allowing writes.
      - id: check-claude-settings-portability
        name: check claude settings portability
        entry: uv run python scripts/check_claude_settings_portability.py .claude/settings.json
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # WOT-2026-024l: docs/registry/INDEX.md es una PROYECCION generada por
      # discover_skills.py --generate-index. Un artefacto con estado embebido
      # CADUCA solo: se midio desincronizado (skill 31/prompt 22 vs 38/30 reales,
      # familias batch/codeonly ausentes) porque el CLI --check-index existia pero
      # NADIE lo invocaba (una barrera que nadie llama es una norma, no un gate).
      # Fail-closed: regenera el catalogo en memoria y compara; drift -> exit 1.
      # always_run + pass_filenames:false: el catalogo sale del arbol vivo, no del
      # argv, y un commit que solo BORRA una skill tambien debe re-verificar.
      - id: check-index-stale
        name: check registry INDEX.md freshness (proyeccion no caduca en silencio)
        entry: uv run python scripts/discover_skills.py --check-index
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # WOT-2026-035b: el 2026-07-18 el archive TRACKEADO de memoria portable
      # (.agent/runtime/memory/archive/observations.YYYY-MM.jsonl) llevo 2
      # entradas con schema NO canonico y ninguna barrera cableada lo caza:
      # validate_observations.py existia pero nadie lo invocaba sobre el
      # archive. always_run + pass_filenames:false: el denominador sale del
      # glob del arbol vivo, no del argv (un commit de solo-borrados tambien
      # debe re-verificar).
      - id: check-portable-memory-archive
        name: check portable memory archive (archive/observations.*.jsonl schema)
        entry: uv run python scripts/check_portable_memory_archive_schema.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # pip-audit: auditoria CVE desde uv.lock (todos los grupos).
      # El wrapper exporta uv.lock a requirements.txt temporal y llama pip-audit -r.
      # Garantia: audita la superficie real del proyecto, no el Python del sistema.
      - id: pip-audit
        name: pip-audit (CVE Detection)
        entry: python scripts/pip_audit_project.py
        language: python
        additional_dependencies: [pip-audit]
        pass_filenames: false
        stages: [pre-push, manual]

      # check-hook-interpreter: detecta INSTALL_PYTHON obsoleto en los hooks
      # generados (repo movido, WOT-2026-016b). Stage manual: un hook automatico
      # seria circular (el propio hook roto no puede invocar de forma fiable al
      # check). Ejecutable por tooling de instalacion o bajo demanda.
      - id: check-hook-interpreter
        name: check hook interpreter (INSTALL_PYTHON stale path)
        entry: uv run python scripts/check_hook_interpreter.py
        language: system
        pass_filenames: false
        stages: [manual]

      # vulture: verificacion no mutadora, solo manual
      - id: vulture
        name: vulture - dead code detection
        entry: uv run vulture bus/ runtime/ scripts/ skills/ tools/ --min-confidence 80 --exclude whitelists,.agent,.cache,.claude,.codex,.opencode,.tmp,.uv-cache,.ruff_cache,tests
        language: system
        types: [python]
        stages: [manual]
